<app-search-bar (searchSubmitted)="handleSearch($event)"></app-search-bar>

<h1 class="text-3xl font-extrabold pb-2 border-b-4 border-blue-300 text-gray-800 tracking-wide">
  Pokémon List
</h1>

<div class="gutter-example pt-5">
  <div nz-row [nzGutter]="[hGutter, vGutter]">
    
    @for (pokemon of cardViewModel$ | async; track pokemon.name) {
      <div nz-col class="gutter-row" [nzSpan]="6">
        
        <app-card [pokemon]="pokemon"></app-card>
        
      </div>
    }
  </div>
</div>

<div class="flex justify-center py-8 mt-4 bg-white shadow-inner">
  <nz-pagination
    [nzPageIndex]="pageIndex$ | async"
    [nzTotal]="total$ | async"
    [nzPageSize]="pageSize$ | async"
    (nzPageIndexChange)="onPageIndexChange($event)"
    [nzShowQuickJumper]="true"
    [nzShowSizeChanger]="false"
  >
  </nz-pagination>
</div>
